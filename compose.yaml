services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: failuredoctor
      POSTGRES_USER: failuredoctor
      POSTGRES_PASSWORD: [REDACTED]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U failuredoctor -d failuredoctor"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    command: ["sh", "-c", "npm run db:migrate && npm start"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
      DATABASE_URL: postgresql://failuredoctor:[REDACTED]@postgres:5432/failuredoctor
      ALLOWED_ORIGINS: http://localhost:8787
    ports:
      - "127.0.0.1:8787:8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
