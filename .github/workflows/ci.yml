name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node --check server/index.js
      - run: npm audit --omit=dev --audit-level=high
      - name: Build production container
        run: docker build --pull -t paypal-failure-doctor:${{ github.sha }} .
